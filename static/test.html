<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тестовый чат — WhatsApp AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3EF; --panel:#FFF; --ink:#1C2024; --muted:#6E7169;
  --line:#E0E2DC; --line-soft:#EDEEE9;
  --pass:#2E7D5B; --fail:#A6402F; --wait:#B4741A;
  --ai:#3B4E8F; --ai-bg:#EDF0FA;
  --mgr:#8A6A1F; --mgr-bg:#FBF3DF;
  --sans:'Archivo',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:400 14px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:20px}

header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
.mode{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;
  padding:5px 8px;border:1px solid var(--line);background:var(--panel);border-radius:3px}
.mode.live{border-color:var(--fail);color:var(--fail)}
header .sp{flex:1}
.ghost{background:none;border:1px solid var(--line);padding:6px 12px;border-radius:6px;
  cursor:pointer;color:var(--muted)}
.ghost:hover{border-color:var(--muted);color:var(--ink)}
.ghost:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

.grid{display:grid;grid-template-columns:270px minmax(0,1fr) 320px;gap:16px;align-items:start}
@media(max-width:1080px){.grid{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;
  color:var(--muted);padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.body{padding:14px 16px}

label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.06em}
select,.txt{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel)}
select:focus,.txt:focus{outline:2px solid var(--ai);outline-offset:-1px;border-color:var(--ai)}
.field+.field{margin-top:14px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px/1 var(--sans);padding:6px 10px;border-radius:20px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

.stat{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line-soft);font-size:13px}
.stat:last-child{border:0}
.stat span:first-child{color:var(--muted)}
.stat b{font:500 13px var(--mono)}

/* --- чат --- */
.chat{height:clamp(380px,54vh,560px);overflow-y:auto;padding:18px 16px;
  background:linear-gradient(var(--paper),var(--paper))}
.msg{max-width:76%;margin-bottom:10px;padding:9px 13px;border-radius:14px;
  font-size:14px;word-wrap:break-word;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.msg{animation:none}}
.msg .who{font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.07em;
  display:block;margin-bottom:4px;opacity:.75}
.m-client{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.m-ai{background:var(--ai-bg);border:1px solid #D5DCF2;color:#1D2647;
  margin-left:auto;border-bottom-right-radius:4px}
.m-ai .who{color:var(--ai)}
.m-manager{background:var(--mgr-bg);border:1px solid #EBDCB0;color:#4A3A10;
  margin-left:auto;border-bottom-right-radius:4px}
.m-manager .who{color:var(--mgr)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 20px}

.compose{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:8px}
.compose .txt{flex:1}
.send{padding:8px 16px;border:0;border-radius:6px;background:var(--ink);color:#fff;
  font-weight:500;cursor:pointer}
.send:hover{background:#000}
.send.alt{background:var(--mgr-bg);color:var(--mgr);border:1px solid #EBDCB0}
.send:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

/* --- трассировка: главный элемент --- */
.verdict{padding:12px 16px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.v-reply .dot{background:var(--pass)} .v-reply b{color:var(--pass)}
.v-silent .dot{background:var(--muted)} .v-silent b{color:var(--muted)}
.v-handoff .dot{background:var(--mgr)} .v-handoff b{color:var(--mgr)}
.v-queue .dot{background:var(--wait)} .v-queue b{color:var(--wait)}
.verdict b{font-size:13px;font-weight:600}
.verdict small{display:block;color:var(--muted);font-size:12px;line-height:1.4}

.trace{padding:6px 16px 14px;font-family:var(--mono);font-size:11.5px}
.tr{display:flex;gap:9px;padding:6px 0;border-bottom:1px dashed var(--line-soft);
  align-items:flex-start}
.tr:last-child{border:0}
.tr i{font-style:normal;font-weight:500;flex:none;width:12px}
.tr.ok i{color:var(--pass)} .tr.no i{color:var(--fail)}
.tr.no{color:var(--fail)}
.tr .d{color:var(--muted);margin-left:auto;text-align:right;max-width:48%}

.countdown{margin:0 16px 14px;padding:11px 13px;border:1px solid #EBDCB0;
  background:var(--mgr-bg);border-radius:8px;font-size:12.5px;color:#4A3A10}
.countdown b{font:500 13px var(--mono)}
.hide{display:none}
.wb{font-family:var(--mono);font-size:11.5px;color:var(--muted);
  padding:5px 0;border-bottom:1px dashed var(--line-soft)}
.wb:last-child{border:0}
.wb u{text-decoration:none;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Тестовый чат</h1>
  <span class="mode" id="mode">…</span>
  <span class="sp"></span>
  <button class="ghost" onclick="resetAll()">Очистить диалог</button>
</header>

<div class="grid">

  <!-- Сделка -->
  <div>
    <section class="card">
      <h2>Сделка в amoCRM</h2>
      <div class="body">
        <div class="field">
          <label for="stage">Этап воронки</label>
          <select id="stage" onchange="saveDeal()">
            <option>Первичный контакт</option>
            <option>Квалификация</option>
            <option>Взят в работу</option>
            <option>Переговоры</option>
            <option>Счёт выставлен</option>
            <option>Закрыто</option>
          </select>
        </div>
        <div class="field">
          <label>Теги</label>
          <div class="chips" id="tags"></div>
        </div>
      </div>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>Состояние</h2>
      <div class="body" id="stats"></div>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>Записано в amo</h2>
      <div class="body" id="wb"><div class="wb">пока пусто</div></div>
    </section>
  </div>

  <!-- Чат -->
  <section class="card">
    <h2>WhatsApp · +7 701 123 45 67</h2>
    <div class="chat" id="chat"><div class="empty">Напишите сообщение как клиент — ИИ примет решение по правилам</div></div>
    <div class="compose">
      <input class="txt" id="text" placeholder="Сообщение от клиента…"
             onkeydown="if(event.key==='Enter')send('client')">
      <button class="send" onclick="send('client')">Клиент</button>
      <button class="send alt" onclick="send('manager')" title="Проверить перехват">Менеджер</button>
    </div>
  </section>

  <!-- Трассировка -->
  <section class="card">
    <h2>Решение</h2>
    <div class="verdict v-silent" id="verdict">
      <span class="dot"></span>
      <div><b>Ожидание</b><small>Отправьте сообщение</small></div>
    </div>
    <div class="countdown hide" id="cd"></div>
    <div class="trace" id="trace"></div>
  </section>

</div>
</div>

<script>
const CHAT_ID = '77011234567';
const TAGS = ['ии','ии_стоп','отказ','не звонить','жалоба','действующий клиент'];
let deadline = 0;

function el(id){ return document.getElementById(id); }
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }

TAGS.forEach(t=>{
  const b=document.createElement('button');
  b.className='chip'; b.type='button'; b.textContent=t;
  b.setAttribute('aria-pressed','false');
  b.onclick=()=>{ b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')==='true'?'false':'true'); saveDeal(); };
  el('tags').appendChild(b);
});

function currentTags(){
  return [...el('tags').children].filter(c=>c.getAttribute('aria-pressed')==='true')
                                 .map(c=>c.textContent);
}

async function saveDeal(){
  await fetch('/test/deal',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({stage:el('stage').value, tags:currentTags()})});
  refresh();
}

async function send(author){
  const inp = el('text');
  const text = inp.value.trim();
  if(!text){ inp.focus(); return; }
  inp.value='';
  const r = await fetch('/test/message',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chat_id:CHAT_ID, text, author})}).then(r=>r.json());
  if(r.action==='scheduled') deadline = Date.now() + (r.delay*1000);
  else deadline = 0;
  refresh();
}

async function resetAll(){
  await fetch('/test/reset',{method:'POST'});
  deadline=0;
  [...el('tags').children].forEach(c=>c.setAttribute('aria-pressed','false'));
  el('stage').value='Первичный контакт';
  refresh();
}

const WHO = {client:'клиент', ai:'ии', manager:'менеджер'};

function render(s){
  el('mode').textContent = s.mode || 'mock';
  el('mode').className = 'mode' + (s.mode==='live'?' live':'');

  // чат
  const chat = el('chat');
  const wasBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60;
  if(!s.messages.length){
    chat.innerHTML='<div class="empty">Напишите сообщение как клиент — ИИ примет решение по правилам</div>';
  } else {
    chat.innerHTML = s.messages.map(m=>
      `<div class="msg m-${m.author}"><span class="who">${WHO[m.author]||m.author}</span>${esc(m.text)}</div>`
    ).join('');
  }
  if(wasBottom) chat.scrollTop = chat.scrollHeight;

  // состояние
  const d = s.dialog||{};
  const left = s.window_hours_left;
  el('stats').innerHTML = [
    ['Состояние', d.state||'sleeping'],
    ['Реплик ИИ', d.ai_message_count??0],
    ['Окно 24 ч', left==null?'—':left.toFixed(1)+' ч'],
    ['В очереди', s.pending_jobs??0],
  ].map(([k,v])=>`<div class="stat"><span>${k}</span><b>${esc(String(v))}</b></div>`).join('');

  // записи в amo
  el('wb').innerHTML = s.writeback.length
    ? s.writeback.slice().reverse().map(w=>`<div class="wb">${esc(w.type)} · <u>${esc(w.text)}</u></div>`).join('')
    : '<div class="wb">пока пусто</div>';

  // вердикт + трассировка
  const last = s.decisions[s.decisions.length-1];
  const v = el('verdict');
  if(!last){
    v.className='verdict v-silent';
    v.innerHTML='<span class="dot"></span><div><b>Ожидание</b><small>Отправьте сообщение</small></div>';
    el('trace').innerHTML='';
  } else {
    const names={reply:'Отвечает',silent:'Молчит',handoff:'Передал человеку',queue:'Отложено'};
    v.className='verdict v-'+last.verdict;
    v.innerHTML=`<span class="dot"></span><div><b>${names[last.verdict]||last.verdict}</b>
      <small>${esc(last.reason)}</small></div>`;
    el('trace').innerHTML = last.checks.map(c=>
      `<div class="tr ${c.passed?'ok':'no'}"><i>${c.passed?'✓':'✕'}</i>
       <span>${esc(c.name)}</span>${c.detail?`<span class="d">${esc(c.detail)}</span>`:''}</div>`
    ).join('') || '<div class="tr">—</div>';
  }

  // обратный отсчёт до ответа ИИ
  const cd = el('cd');
  const rest = Math.ceil((deadline-Date.now())/1000);
  if(rest>0 && d.state!=='handed_off'){
    cd.classList.remove('hide');
    cd.innerHTML=`ИИ ответит через <b>${rest} с</b>. Напишите как менеджер — и он замолчит.`;
  } else {
    cd.classList.add('hide');
    if(rest<=0) deadline=0;
  }
}

async function refresh(){
  try{
    const s = await fetch(`/test/state?chat_id=${CHAT_ID}`).then(r=>r.json());
    const h = await fetch('/health').then(r=>r.json());
    render({...s, mode:h.mode});
  }catch(e){ /* сервер перезапускается — молча ждём */ }
}

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
