# Правила, по которым ИИ решает — отвечать или молчать.
# Файл читается на лету: правки применяются без перезапуска сервера.
# Проверки идут сверху вниз, первое совпадение стоп-правила выключает ИИ.

enabled: true

# ---------------------------------------------------------------
# 1. Где ИИ работает. Этапы воронки amoCRM.
#    Указывайте либо name (как в интерфейсе амо), либо status_id.
# ---------------------------------------------------------------
stages:
  mode: allowlist          # allowlist = только перечисленные | blocklist = все кроме
  values:
    - "Первичный контакт"
    - "Квалификация"
    - "Взят в работу"

# ---------------------------------------------------------------
# 2. Кому нельзя писать никогда. Проверяется раньше всего остального.
# ---------------------------------------------------------------
stop_list:
  tags:                    # теги на сделке или контакте
    - "отказ"
    - "не звонить"
    - "жалоба"
    - "действующий клиент"
  phones: []               # конкретные номера в формате 77001234567
  # Если в сделке заполнено это поле — ИИ молчит
  field_flags:
    - field: "Без бота"
      when_truthy: true

# ---------------------------------------------------------------
# 3. Явный тумблер. Если задан — перекрывает правило по этапам.
#    Так менеджер включает ИИ точечно прямо из карточки сделки.
# ---------------------------------------------------------------
manual_switch:
  on_tag: "ии"             # поставили тег — ИИ включился
  off_tag: "ии_стоп"       # поставили тег — ИИ выключился

# ---------------------------------------------------------------
# 4. Часы работы. Вне этого окна сообщения копятся и уходят утром.
# ---------------------------------------------------------------
schedule:
  timezone: "Asia/Almaty"
  workdays: [1, 2, 3, 4, 5, 6]   # 1 = понедельник, 7 = воскресенье
  start: "09:00"
  end: "21:00"
  outside_hours: queue     # queue = ответить в начале рабочего дня | silent = промолчать

# ---------------------------------------------------------------
# 5. Ограничители. Защита от зацикливания и назойливости.
# ---------------------------------------------------------------
limits:
  max_ai_messages_per_dialog: 20     # всего реплик ИИ в одном диалоге
  max_followups: 2                   # догоняющих сообщений, если клиент замолчал
  followup_after_minutes: 240        # через сколько минут молчания дожимать
  min_seconds_between_replies: 5     # анти-флуд
  window_hours: 24                   # окно WhatsApp, вне его ИИ не пишет

# ---------------------------------------------------------------
# 6. Когда передавать человеку. Совпадение — ИИ замолкает и зовёт менеджера.
# ---------------------------------------------------------------
handoff:
  keywords:
    - "менеджер"
    - "человек"
    - "оператор"
    - "жалоба"
    - "юрист"
    - "верните деньги"
    - "суд"
  on_price_negotiation: true    # клиент торгуется
  on_repeat_question: 3         # один и тот же вопрос N раз подряд
  on_profanity: true
  notify:
    telegram: true
    amo_task: true
    task_text: "Клиент требует менеджера — ИИ передал диалог"

# ---------------------------------------------------------------
# 7. Что ИИ пишет обратно в amoCRM.
# ---------------------------------------------------------------
amo_writeback:
  add_note: true              # примечание с текстом диалога
  move_stage: false           # менять этап самостоятельно — по умолчанию запрещено
  target_stage: "Квалификация"
  set_tag_on_handoff: "нужен_менеджер"
  set_tag_on_window_closed: "требует_шаблона"
